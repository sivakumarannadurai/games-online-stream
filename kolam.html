<!DOCTYPE html>
<html>
<head>
    <title>Traditional Sikku Kolam AI</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .canvas-container { background: #fff; padding: 20px; border-radius: 12px; border: 8px solid #db2777; box-shadow: 0 20px 60px rgba(219, 39, 119, 0.4); }
        canvas { background: #fff; }
        .controls { margin-top: 30px; display: flex; gap: 15px; }
        button { padding: 14px 30px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; background: #db2777; color: white; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #9d174d; transform: scale(1.05); }
        h2 { color: #f9a8d4; font-weight: 300; letter-spacing: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>SIKKU PULLI ART</h2>
    <div class="canvas-container">
        <canvas id="kolamCanvas" width="500" height="500"></canvas>
    </div>
    
    <div class="controls">
        <button onclick="generate()">Generate New Pattern</button>
    </div>

<script>
const canvas = document.getElementById('kolamCanvas');
const ctx = canvas.getContext('2d');
const center = 250;
const dotSpacing = 55;

function drawGrid() {
    ctx.fillStyle = "#fbcfe8";
    // 7x7 Square Grid (can be changed to Diamond)
    for (let r = -3; r <= 3; r++) {
        for (let c = -3; c <= 3; c++) {
            ctx.beginPath();
            ctx.arc(center + c * dotSpacing, center + r * dotSpacing, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function generate() {
    ctx.clearRect(0, 0, 500, 500);
    drawGrid();
    
    ctx.strokeStyle = "#db2777";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Traditional 4-fold radial symmetry
    for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate((i * 90) * Math.PI / 180);
        
        drawSikkuLoop();
        
        ctx.restore();
    }
}

function drawSikkuLoop() {
    ctx.beginPath();
    
    // Starting point between center dots
    ctx.moveTo(0, -20);

    // Randomize loop factors for "Thousands of designs"
    const loopSize = 110 + Math.random() * 60;
    const curveWidth = 60 + Math.random() * 40;
    const knotFlex = 20 + Math.random() * 30;

    // The Main Outer "Wing"
    ctx.bezierCurveTo(
        curveWidth, -knotFlex, 
        curveWidth, -loopSize, 
        0, -loopSize - 20
    );
    
    ctx.bezierCurveTo(
        -curveWidth, -loopSize, 
        -curveWidth, -knotFlex, 
        0, -20
    );

    // The Inner Interlacing "Knot"
    ctx.moveTo(dotSpacing, -dotSpacing);
    ctx.quadraticCurveTo(dotSpacing + 40, -dotSpacing - 40, dotSpacing + 80, -dotSpacing);
    ctx.quadraticCurveTo(dotSpacing + 40, -dotSpacing + 40, dotSpacing, -dotSpacing);

    ctx.stroke();
}

// Initial draw
generate();
</script>
</body>
</html>
