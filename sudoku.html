<!DOCTYPE html>
<html>
<head>
    <title>Strategic Human AI Sudoku</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(9, 45px); border: 4px solid #38bdf8; background: #1e293b; }
        .cell { width: 45px; height: 45px; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; transition: all 0.3s; }
        .fixed { color: #64748b; background: #0f172a; }
        .thinking { background: #fbbf24; color: #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .scanning { border: 2px solid #38bdf8; background: rgba(56, 189, 248, 0.2); }
        .error { background: #ef4444; color: #fff; }
        .cell:nth-child(3n) { border-right: 3px solid #38bdf8; }
        .grid > div:nth-child(n+19):nth-child(-n+27), 
        .grid > div:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #38bdf8; }
        #status { font-family: monospace; color: #38bdf8; font-size: 16px; margin-bottom: 20px; text-transform: uppercase; }
        button { margin-top: 20px; padding: 12px 30px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>STRATEGIC HUMAN AI</h1>
    <div id="status">Waiting for start...</div>
    <div class="grid" id="grid"></div>
    <button onclick="startSolving()">START SCANNING</button>

<script>
const board = [
    [5, 3, 0, 0, 7, 0, 0, 0, 0],
    [6, 0, 0, 1, 9, 5, 0, 0, 0],
    [0, 9, 8, 0, 0, 0, 0, 6, 0],
    [8, 0, 0, 0, 6, 0, 0, 0, 3],
    [4, 0, 0, 8, 0, 3, 0, 0, 1],
    [7, 0, 0, 0, 2, 0, 0, 0, 6],
    [0, 6, 0, 0, 0, 0, 2, 8, 0],
    [0, 0, 0, 4, 1, 9, 0, 0, 5],
    [0, 0, 0, 0, 8, 0, 0, 7, 9]
];

const cells = [];
const status = document.getElementById('status');

function drawGrid() {
    const gridEl = document.getElementById('grid');
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            const div = document.createElement('div');
            div.className = 'cell';
            if (board[r][c] !== 0) {
                div.innerText = board[r][c];
                div.classList.add('fixed');
            }
            gridEl.appendChild(div);
            cells.push(div);
        }
    }
}

function getPossibleValues(r, c) {
    let vals = [];
    for (let n = 1; n <= 9; n++) {
        if (isValid(board, r, c, n)) vals.push(n);
    }
    return vals;
}

function isValid(b, r, c, n) {
    for (let i = 0; i < 9; i++) if (b[r][i] === n || b[i][c] === n) return false;
    let sr = r - r % 3, sc = c - c % 3;
    for (let i = 0; i < 3; i++)
        for (let j = 0; j < 3; j++)
            if (b[i + sr][j + sc] === n) return false;
    return true;
}

async function solveStrategic() {
    let bestCell = null;
    let minChoices = 10;

    // 1. Scan for the "Easiest" cell (fewest possibilities)
    status.innerText = "SCANNING FOR EASY WINS...";
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (board[r][c] === 0) {
                let choices = getPossibleValues(r, c);
                if (choices.length < minChoices) {
                    minChoices = choices.length;
                    bestCell = {r, c, choices};
                }
            }
        }
    }

    // No more empty cells? We are done!
    if (!bestCell) return true;

    const {r, c, choices} = bestCell;
    const cellEl = cells[r * 9 + c];
    
    // 2. Visual "Thinking" on the chosen cell
    cellEl.classList.add('scanning');
    status.innerText = `FOUND CELL AT (${r+1},${c+1}) WITH ${choices.length} OPTIONS`;
    await new Promise(res => setTimeout(res, 800));
    cellEl.classList.remove('scanning');

    for (let n of choices) {
        board[r][c] = n;
        cellEl.innerText = n;
        cellEl.classList.add('thinking');
        status.innerText = `I THINK THIS IS A ${n}...`;
        
        await new Promise(res => setTimeout(res, 1000));

        if (await solveStrategic()) return true;

        // Backtrack
        cellEl.classList.add('error');
        status.innerText = `WAIT, ${n} WAS A MISTAKE...`;
        await new Promise(res => setTimeout(res, 500));
        board[r][c] = 0;
        cellEl.innerText = '';
        cellEl.classList.remove('thinking', 'error');
    }
    
    return false;
}

async function startSolving() {
    document.querySelector('button').style.display = 'none';
    await solveStrategic();
    status.innerText = "SUDOKU FINISHED BY STRATEGY!";
}

drawGrid();
</script>
</body>
</html>
